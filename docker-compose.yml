services:
  postgres:
    image: postgres:18-alpine
    container_name: predicktions-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predicktions}
      POSTGRES_USER: ${POSTGRES_USER:-predicktions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicktions}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-predicktions} -d ${POSTGRES_DB:-predicktions}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: