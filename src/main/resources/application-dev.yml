spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predicktions}
    username: ${DB_USERNAME:predicktions}
    password: ${DB_PASSWORD:predicktions}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.ven.predicktions: DEBUG
    org.springframework.web: INFO